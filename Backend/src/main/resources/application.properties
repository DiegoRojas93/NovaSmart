# ==========================================
# CONEXIÓN A BASE DE DATOS (Con valores por defecto para el IDE)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/novasmart_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tu_password_seguro}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE HIKARICP (Pool de conexiones)
# ==========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# CONFIGURACIÓN DE LOGS PARA JDBC (Opcional, pero muy útil)
# ==========================================
# Como usas JdbcTemplate, esto imprimirá las consultas SQL en tu consola
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# ==========================================
# NOTA SOBRE JPA/HIBERNATE
# ==========================================
# Comenté estas líneas porque al inicio me mencionaste que es un proyecto
# "Spring Data JDBC" (y en tu código vi que usas JdbcTemplate).
# Hibernate y JPA son otra tecnología diferente. Las propiedades de abajo
# solo funcionan si usas "Spring Data JPA", por lo que en este proyecto
# no tendrán ningún efecto.

